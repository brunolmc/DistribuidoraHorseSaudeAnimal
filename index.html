<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Distribuidora Horse Saúde Animal</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="./_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary)}a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-strong)}</style>
</head>
<body>
<div id="root"></div>
<script src="products.js"></script>
<script type="text/babel" src="shared.js"></script>
<script type="text/babel" src="header.js"></script>
<script type="text/babel" src="footer.js"></script>
<script type="text/babel" src="home-screen.js"></script>
<script type="text/babel" src="catalog-screen.js"></script>
<script type="text/babel" src="about-screen.js"></script>
<script type="text/babel" src="contact-screen.js"></script>
<script type="text/babel">
function App(){
  const [route, setRoute] = useState('home');
  React.useEffect(() => { window.scrollTo(0, 0); }, [route]);
  const screens = { home: HomeScreen, catalog: CatalogScreen, about: AboutScreen, contact: ContactScreen };
  const Screen = screens[route] || HomeScreen;
  return (
    <div>
      <Header route={route} setRoute={setRoute} />
      <main><Screen setRoute={setRoute} /></main>
      <Footer setRoute={setRoute} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
